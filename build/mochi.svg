<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF5EA"/><stop offset="1" stop-color="#F3E9D8"/>
    </linearGradient>
    <radialGradient id="mochi" cx="0.42" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FCE3EA"/><stop offset="0.55" stop-color="#F6BFCF"/><stop offset="1" stop-color="#EA9BB2"/>
    </radialGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9CF86"/><stop offset="1" stop-color="#6FA559"/>
    </linearGradient>
    <linearGradient id="leafB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BBDA98"/><stop offset="1" stop-color="#7DB264"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="powder" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- shadow under the mochi -->
  <ellipse cx="512" cy="738" rx="250" ry="34" fill="#D9C7AE" opacity="0.7" filter="url(#soft)"/>
  <!-- the mochi: a soft squashed dome -->
  <path d="M262 690 C 236 520, 360 392, 512 392 C 664 392, 788 520, 762 690 C 752 738, 690 750, 512 750 C 334 750, 272 738, 262 690 Z" fill="url(#mochi)"/>
  <!-- powdery highlight -->
  <ellipse cx="430" cy="505" rx="96" ry="58" fill="#FFFFFF" opacity="0.5" filter="url(#powder)" transform="rotate(-24 430 505)"/>
  <!-- two leaves tucked on top -->
  <g transform="rotate(-28 470 380)">
    <path d="M470 400 C 400 380, 352 320, 360 250 C 430 262, 480 320, 470 400 Z" fill="url(#leafA)"/>
    <path d="M466 392 C 430 350, 400 310, 372 266" stroke="#5E8F4B" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g transform="rotate(22 550 380)">
    <path d="M550 400 C 620 380, 676 316, 668 236 C 590 250, 540 316, 550 400 Z" fill="url(#leafB)"/>
    <path d="M554 392 C 594 346, 628 300, 656 252" stroke="#649852" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
