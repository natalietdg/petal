# Petal packaging. `npm run package` builds the .app only; `npm run dist` adds the dmg and zip.
appId: app.petal.reader
productName: Petal
directories:
  output: dist.noindex # .noindex keeps Spotlight from indexing build output
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/node_modules/node-pty/prebuilds/win32-*/**"
  - "!**/node_modules/node-pty/deps/**"
  - "!**/node_modules/node-pty/src/**"
  - "!**/node_modules/node-pty/third_party/**"
  # Stale rebuild output and build intermediates; node-pty loads build/Release/pty.node or prebuilds/.
  - "!**/node_modules/node-pty/bin/**"
  - "!**/node_modules/node-pty/build/Release/{obj.target,.deps,node-addon-api}/**"
  - "!**/node_modules/node-pty/build/Release/.forge-meta"
# Petal's reply styles, copied to ~/.claude/output-styles only when the user asks.
extraResources:
  - from: resources/output-styles
    to: output-styles
    filter: ["petal-*.md"]
asarUnpack:
  - "**/node_modules/node-pty/**"
mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Unsigned by default; scripts/release.sh (npm run release) passes the Developer ID identity and turns notarize on.
  identity: null
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  # The zip is what electron-updater downloads on macOS; keep it.
  # Both slices ship node-pty's prebuilt darwin-x64 and darwin-arm64 binaries unchanged.
  x64ArchFiles: "**/node_modules/node-pty/prebuilds/darwin-*/**"
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
# Builds write latest-mac.yml for electron-updater; scripts/release.sh uploads to R2 behind the petal-downloads Worker.
publish:
  provider: generic
  url: https://petal-downloads.natalieleong19.workers.dev
  useMultipleRangeRequest: false # the Worker serves one range per request
