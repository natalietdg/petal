<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
  <title>Petal</title>
</head>
<body>
  <div id="app">
    <div id="reader-area">
      <section id="history" hidden></section>
      <section id="workflow" hidden></section>
      <section id="customize" hidden></section>
      <section id="repos" hidden aria-label="Open Repo"></section>
      <section id="welcome" hidden aria-label="Welcome to Petal"></section>
      <section id="get-started" hidden aria-label="Get started"></section>
      <section id="consent" hidden tabindex="-1" aria-label="Read your Claude folder?"></section>
      <section id="board" hidden aria-label="Sessions board"></section>
      <aside id="sessions-dock">
        <button id="customize-button" class="dock-button" type="button" aria-pressed="false">Customize</button>
        <button id="workflow-button" class="dock-button" type="button" aria-pressed="false">Workflow</button>
        <button id="history-button" class="dock-button" type="button" aria-pressed="false">History</button>
        <button id="add-session-button" class="dock-button add-session" type="button" title="New tab (⌘T)">Add Session</button>
        <button id="update-pill" class="update-pill" type="button" hidden></button>
        <button id="sessions-pill" class="sessions-pill" type="button" aria-expanded="false"></button>
        <div id="sessions-panel" class="sessions-panel" hidden></div>
      </aside>
      <header id="reader-head">
        <div class="reader-head-column">
          <div class="reader-context">
            <p id="reader-session" class="reader-session" hidden></p>
            <p id="reader-repo" class="reader-repo" hidden></p>
          </div>
          <div class="reader-head-row">
            <div class="view-toggle" role="tablist">
              <button type="button" data-view="replies" aria-selected="true">Replies</button>
              <button type="button" data-view="flow" aria-selected="false">Flow</button>
              <button type="button" data-view="decisions" aria-selected="false">Decisions</button>
            </div>
            <div class="reader-head-end">
              <button type="button" id="colour-key-button" class="colour-key-button" aria-haspopup="dialog" aria-expanded="false" aria-controls="colour-key" title="What the colours in a reply mean"><span class="ck-dots" aria-hidden="true"></span>Colour key</button>
              <button id="agents-chip" class="agents-chip" type="button" hidden></button>
              <button id="reader-star" class="fav-star reader-star" type="button" hidden></button>
              <button id="notes-toggle" class="notes-toggle" type="button" aria-pressed="false" title="Your notes for this session, beside the replies">Notes</button>
            </div>
          </div>
        </div>
        <div id="colour-key" class="colour-key" role="dialog" aria-label="Colour key" hidden></div>
        <div id="agents-menu" class="agents-menu" role="menu" aria-label="Agents today" tabindex="-1" hidden></div>
      </header>
      <div id="cat"></div>
      <aside id="notes-panel" hidden></aside>
      <aside id="agent-panel" hidden></aside>
      <main id="reader" aria-live="polite">
        <div class="reader-column">
          <div id="replies-view">
            <p id="reader-status" class="status"></p>
            <article id="latest"></article>
            <section id="older"></section>
          </div>
          <section id="flow-view" class="prose" hidden></section>
          <section id="decisions-view" class="prose" hidden></section>
        </div>
      </main>
      <section id="prompt-dock" aria-live="polite"></section>
      <form id="composer" autocomplete="off">
        <textarea id="composer-input" rows="1" placeholder="Message Claude…" aria-label="Message Claude"></textarea>
        <button id="composer-send" type="submit" aria-label="Send">Send</button>
      </form>
    </div>
    <div id="divider" role="separator" aria-orientation="horizontal" aria-label="Resize reader and terminal" aria-valuemin="20" aria-valuemax="85" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <section id="terminal-pane">
      <nav id="tab-strip" role="tablist" aria-label="Sessions"></nav>
      <div id="terminal"></div>
    </section>
  </div>
  <script type="module" src="./app.ts"></script>
</body>
</html>
